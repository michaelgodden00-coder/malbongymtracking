<script>
const MU=['chest','upper back','lats','traps','front delts','side delts','rear delts','biceps','triceps','forearms','quadriceps','hamstrings','glutes','calves','abdominals','lower back','adductors'];

const K='fairway_v1';let S;

 if(!S.ex.length)[['Barbell Back Squat','quadriceps',['glutes','adductors','lower back'],'compound','Barbell','Squat',0],['Bench Press','chest',['triceps','front delts'],'compound','Barbell','Horizontal push',0],['Deadlift','hamstrings',['glutes','lower back','traps'],'compound','Barbell','Hinge',0],['Pull-Up','lats',['biceps','upper back'],'compound','Bodyweight','Vertical pull',0],['Overhead Press','front delts',['triceps','side delts'],'compound','Barbell','Vertical push',0],['Barbell Row','upper back',['lats','biceps','rear delts'],'compound','Barbell','Horizontal pull',0]].forEach(a=>S.ex.push({id:uid(),name:a[0],p:a[1],s:a[2],cat:a[3],eq:a[4],pat:a[5],uni:false,notes:'',inc:0}));save()}

const $=s=>document.querySelector(s),ex=id=>S.ex.find(e=>e.id==id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')},today=()=>iso(new Date());

const best1=h=>Math.max(...h.sets.map(x=>e1(x.w,x.r)));
function inc(e){return +e.inc||+S.set.inc}

 const rirOk=l.sets.every(x=>x.rir==null||x.rir===''||+x.rir>=1)&&l.sets.every(x=>x.rpe==null||x.rpe===''||+x.rpe<=9.5),conf=h.length>=4?'High':h.length>=2?'Medium':'Low';

 else if(minr>=hi)Object.assign(o,{w:top,reps:lo+'–'+hi,sets:n,mode:'Maintenance',why:'Top of range hit, but RIR/RPE shows you were at or near failure. Repeat before adding load.',alt:`Try ${top+i} kg for ${lo} reps.`});

function line(pts,fmt=v=>v){if(pts.length<1)return'<div class="empty">No data in this range yet.</div>';const W=620,H=200,p=34,xs=pts.map(a=>a.x),ys=pts.map(a=>a.y),mn=Math.min(...ys)*.95,mx=Math.max(...ys)*1.02||1,t0=Math.min(...xs),t1=Math.max(...xs)||1;

 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="M${pts.map(a=>X(a.x)+','+Y(a.y)).join('L')}" fill="none" stroke="var(--g)" stroke-width="2.5"/>${pts.map(a=>`<circle cx="${X(a.x)}" cy="${Y(a.y)}" r="4" fill="var(--ac)"><title>${a.t}: ${fmt(a.y)}</title></circle>`).join('')}<text x="2" y="${Y(mx)+4}">${fmt(r1(mx))}</text><text x="2" y="${Y(mn)+4}">${fmt(r1(mn))}</text><text x="${p}" y="${H-8}">${pts[0].t}</text><text x="${W-80}" y="${H-8}">${pts[pts.length-1].t}</text></svg>`}

const V={
clubhouse(){const ws=mon(today()),wk=S.wk.filter(w=>w.date>=ws),prev=S.wk.filter(w=>w.date>=mon(dAgo(7))&&w.date<ws),sets=wk.reduce((a,w)=>a+w.en.reduce((b,e)=>b+work(e.sets).length,0),0),reps=wk.reduce((a,w)=>a+w.en.reduce((b,e)=>b+work(e.sets).reduce((c,s)=>c+s.r,0),0),0),vol=a=>a.reduce((x,w)=>x+w.en.reduce((y,e)=>y+svol(e.sets),0),0),m=mus(ws,today()),nm=MU.filter(k=>m[k].sets>0).length;

 let best=null,prs=allPR(),lastPR=prs.filter(p=>p.k=='e1rm').sort((a,b)=>a.date<b.date?1:-1)[0],strong=prs.filter(p=>p.k=='heavy').sort((a,b)=>b.v-a.v)[0];

 const days=[];for(let i=83;i>=0;i--){const d=dAgo(i),c=S.wk.filter(w=>w.date==d).length;days.push(`<b class="${c>1?'m':c?'l':''}" title="${d}"></b>`)}

 return`<div class="lab">Members' dashboard</div><h1>The Clubhouse</h1><p class="note">Week of ${ws}. Everything here is calculated from your logged sets.</p>
 <div class="grid">${st('Workouts this week',wk.length)}${st('Sets / reps',sets+' / '+reps)}${st('Volume',Math.round(vol(wk)).toLocaleString(),'kg')}${st('Muscle groups',nm)}${st('Streak',str,'wks')}${st('Last week volume',Math.round(vol(prev)).toLocaleString(),'kg')}</div>

 <div class="card"><div class="lab">Volume by week</div>${line(weekVol(),v=>v+' kg')}</div>`},
training(){let d=S.draft,h='';
 if(!d)h=`<div class="card"><h2>Begin a session</h2><div class="row"><input id="wn" placeholder="Workout name (e.g. Push)" list="rt"><datalist id="rt">${S.routines.map(r=>`<option>${esc(r.name)}`).join('')}</datalist><input type="date" id="wd" value="${today()}"><button onclick="A.start()">Start workout</button></div></div>`;

 <button class="sm" style="margin-top:8px" onclick="A.addSet(${i})">+ Add set</button></div>`}).join('')||'<div class="empty">Add an exercise from your library to begin logging.</div>'}

 ${S.recap?recap():''}`},

muscles(){const n=UI.mu,m=mus(dAgo(n-1),today()),pm=mus(dAgo(2*n-1),dAgo(n)),tot=MU.reduce((a,k)=>a+m[k].sets,0)||1,mx=Math.max(1,...MU.map(k=>m[k].sets)),sum=l=>l.reduce((a,k)=>a+m[k].sets,0),up=sum(UP),lw=tot-up,pu=sum(PUSH),pl=sum(PULL),sel=UI.sel;

 <div class="card"><div class="lab">${sel||'Select a muscle'}</div>${sel?`<div class="big">${r1(m[sel].sets)} <small style="font-size:14px">sets</small></div>${Object.entries(m[sel].ex).map(([k,v])=>`<p>${esc(k)} — ${r1(v)} sets</p>`).join('')||'<p class="note">Not trained in this period.</p>'}`:''}<div class="lab" style="margin-top:12px">Balance</div>${pc(up,lw,'Upper','Lower')}${pc(pu,pl,'Push','Pull')}</div></div>
 <div class="card"><div class="lab">Sets &amp; share by muscle · recovery awareness</div><div class="sc"><table class="tbl"><tr><th>Muscle<th>Sets<th>Share<th>Sessions<th>vs prior<th>Last trained</tr>${MU.map(k=>{const last=S.wk.filter(w=>w.en.some(e=>{const x=ex(e.ex);return x&&(x.p==k||x.s.includes(k))})).map(w=>w.date).sort().pop(),dd=last?Math.round((new Date(today())-new Date(last))/864e5):null,d=m[k].sets-pm[k].sets;return`<tr><td>${k}<td>${r1(m[k].sets)}<td><div class="bar" style="min-width:80px"><i style="width:${m[k].sets/tot*100}%"></i></div>${r1(m[k].sets/tot*100)}%<td>${m[k].days.size}<td>${d>0?'+':''}${r1(d)}<td>${last?dd+'d ago '+(dd<2?'· recently worked':dd<4?'· recovering':'· rested'):'—'}</tr>`}).join('')}</table></div><p class="note">Recovery labels use days since last session only; they don't measure actual recovery.</p></div>`},
progress(){const id=UI.sel2||S.ex.find(e=>hist(e.id).length)?.id||S.ex[0]?.id,days={4:28,8:56,12:91,26:182,0:99999}[0]&&UI.pr,cut=dAgo(UI.pr),h=hist(id).filter(x=>x.date>=cut),mk=f=>h.map(x=>({x:new Date(x.date).getTime(),y:f(x),t:x.date}));
 const dlt=h.length>1?`e1RM moved from ${r1(best1(h[0]))} kg to ${r1(best1(h[h.length-1]))} kg across ${h.length} sessions (${h[0].date} → ${h[h.length-1].date}).`:'Log at least two sessions in this range to compare.';
 const ch=(t,f,u)=>`<div class="card"><div class="lab">${t}</div>${line(mk(f),v=>v+u)}</div>`;
 return`<h1>Progress</h1><div class="row"><select onchange="UI.sel2=this.value;go()">${exOpts(id)}</select><select onchange="UI.pr=+this.value;go()">${[[28,'Last 4 weeks'],[56,'Last 8 weeks'],[91,'Last 3 months'],[182,'Last 6 months'],[36500,'All time']].map(([v,l])=>`<option value="${v}" ${UI.pr==v?'selected':''}>${l}</option>`).join('')}</select></div><p><b>${dlt}</b></p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${ch('Estimated 1RM (Epley)',x=>r1(best1(x)),' kg')}${ch('Best set weight',x=>Math.max(...x.sets.map(s=>s.w)),' kg')}${ch('Session volume',x=>svol(x.sets),' kg')}${ch('Total reps',x=>x.sets.reduce((a,s)=>a+s.r,0),'')}</div>`},
overload(){const rs=S.ex.map(rec).filter(Boolean);
 return`<h1>Progressive Overload</h1><p class="note">Rule-based double progression using your last session, rep range, RIR/RPE and recent trend. Weight rises only when performance earns it.</p>${rs.map(r=>{const e=r.ex;return`<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(e.name)}</h2><span class="pill" style="background:var(--ac)">${r.mode}</span></div>
 <div class="grid"><div><div class="lab">Previous (${r.l.date})</div>${r.l.sets.map(s=>s.w+' kg × '+s.r).join('<br>')}</div><div><div class="lab">Suggested next</div><div class="big">${r.w} kg</div>${r.sets} sets × ${r.reps} reps</div><div><div class="lab">Why · confidence ${r.conf}</div>${r.why}<br><span class="note">Alternative: ${r.alt}</span></div></div>
 ${r.flags.map(f=>`<p style="color:var(--ac)">⚑ ${f}</p>`).join('')}${r.state?`<p class="note">Status: ${r.state}</p>`:`<button class="sm" onclick="A.acc('${e.id}',${r.w},'${r.reps}',${r.sets},'${r.l.date}')">Accept</button> <button class="sm alt" onclick="A.edt('${e.id}',${r.w},'${r.reps}',${r.sets},'${r.l.date}')">Edit</button> <button class="sm alt" onclick="A.dis('${e.id}','${r.l.date}')">Dismiss</button>`}</div>`}).join('')||'<div class="empty">Log a session and recommendations will appear here.</div>'}<p class="note">Rep range defaults live in Settings; step size is per exercise in the Library.</p>`},
records(){const pr=allPR(),gl=S.goals;
 return`<h1>Record Book</h1><div class="grid">${pr.filter(p=>['heavy','e1rm','vol'].includes(p.k)).sort((a,b)=>a.n.localeCompare(b.n)).map(p=>`<div class="card" style="border-left:6px solid var(--ac)"><div class="lab">${{heavy:'Heaviest',e1rm:'Best est. 1RM',vol:'Session volume'}[p.k]}</div><h3>${esc(p.n)}</h3><div class="big">${r1(p.v)}<small style="font-size:14px"> kg</small></div><div class="note">${p.date}</div></div>`).join('')||'<div class="empty">Records appear automatically as you log sets.</div>'}</div>
 <h2>Goals</h2><div class="row"><select id="ge">${exOpts()}</select><input id="gt" type="number" placeholder="Target kg"><button class="sm" onclick="A.goal()">Add goal</button></div>${gl.map((g,i)=>{const h=hist(g.ex),c=h.length?Math.max(...h.map(best1)):0;return`<div class="card"><b>${esc(ex(g.ex)?.name)}</b> — ${r1(c)} / ${g.t} kg (e1RM) <button class="sm alt" onclick="S.goals.splice(${i},1);save();go()">✕</button><div class="bar"><i style="width:${Math.min(100,c/g.t*100)}%"></i></div></div>`}).join('')}
 <h2>Bodyweight</h2><div class="row"><input id="bw" type="number" step=".1" placeholder="kg"><button class="sm" onclick="A.bw()">Log</button></div><div class="card">${line(S.bw.slice().sort((a,b)=>a.d<b.d?-1:1).map(b=>({x:new Date(b.d).getTime(),y:b.kg,t:b.d})),v=>v+' kg')}</div>
 <h2>Training notes</h2><div class="row"><input id="nt" placeholder="Energy, sleep, fatigue, observations" style="flex:1"><button class="sm" onclick="A.note()">Save</button></div>${S.notes.slice().reverse().map(n=>`<div class="card"><span class="note">${n.d}</span><br>${esc(n.t)}</div>`).join('')}`},
settings(){const s=S.set;return`<h1>Settings</h1><div class="card"><div class="grid"><label>Secondary muscle weight<br><input type="number" step=".1" value="${s.sec}" onchange="S.set.sec=+this.value;save()"></label><label>Default weight step (kg)<br><input type="number" step=".25" value="${s.inc}" onchange="S.set.inc=+this.value;save()"></label><label>Default rep range<br><input type="number" value="${s.lo}" onchange="S.set.lo=+this.value;save()"> – <input type="number" value="${s.hi}" onchange="S.set.hi=+this.value;save()"></label><label>Theme<br><select onchange="S.set.theme=this.value;save();theme()">${['auto','light','dark'].map(t=>`<option ${s.theme==t?'selected':''}>${t}</option>`).join('')}</select></label></div></div>
 <div class="card"><div class="row"><button onclick="A.csv()">Export CSV</button><button class="alt" onclick="A.json()">Backup JSON</button><button class="x" onclick="if(confirm('Erase ALL data on this device?')){localStorage.removeItem(K);load();go()}">Erase all data</button></div><p class="note">Data is stored in this browser on this device. Export a backup regularly; clearing site data removes it.</p></div>`}};
function recap(){const w=S.wk.find(x=>x.id==S.recap);if(!w)return'';const m=[...new Set(w.en.flatMap(e=>{const x=ex(e.ex);return x?[x.p,...x.s]:[]}))];return`<div class="card" style="border:2px solid var(--ac)"><div class="lab">Session recap</div><h2>${esc(w.name)}</h2><div class="big">${Math.round(w.en.reduce((a,e)=>a+svol(e.sets),0))} kg</div><p>${w.en.length} exercises · ${w.en.reduce((a,e)=>a+work(e.sets).length,0)} working sets${S.recapPR?.length?'<br><b style="color:var(--ac)">New records: '+S.recapPR.join(', ')+'</b>':''}</p>${m.map(x=>`<span class="pill">${x}</span>`).join('')}<p><button class="sm alt" onclick="S.recap=null;go()">Close</button></p></div>`}
function allPR(){const o=[];S.ex.forEach(e=>{const h=hist(e.id);if(!h.length)return;let hv={v:0},ee={v:0},vv={v:0};h.forEach(x=>{x.sets.forEach(s=>{if(s.w>hv.v)hv={v:s.w,date:x.date};const q=e1(s.w,s.r);if(q>ee.v)ee={v:q,date:x.date}});const v=svol(x.sets);if(v>vv.v)vv={v,date:x.date}});o.push({n:e.name,k:'heavy',...hv},{n:e.name,k:'e1rm',...ee},{n:e.name,k:'vol',...vv})});return o}
function weekVol(){const m={};S.wk.forEach(w=>{const k=mon(w.date);m[k]=(m[k]||0)+w.en.reduce((a,e)=>a+svol(e.sets),0)});return Object.keys(m).sort().slice(-12).map(k=>({x:new Date(k).getTime(),y:Math.round(m[k]),t:k}))}
const A={start(){S.draft={name:$('#wn').value||'Workout',date:$('#wd').value||today(),en:[]};save();go()},
 addEx(){const id=$('#ae').value;if(!id)return;const p=hist(id).pop(),n=p?p.sets.length:3,l=p?p.sets[p.sets.length-1]:{w:0,r:0},t=S.targets[id];S.draft.en.push({ex:id,sets:Array.from({length:Math.min(n,1)},()=>({w:t&&t.state=='accepted'?t.w:l.w,r:l.r,rpe:'',rir:'',warm:false,note:''}))});save();go()},
 rmEx(i){S.draft.en.splice(i,1);save();go()},f(i,j,k,v){S.draft.en[i].sets[j][k]=['w','r','rpe','rir'].includes(k)?(v===''?'':+v):v;save()},
 addSet(i){const s=S.draft.en[i].sets,l=s[s.length-1]||{w:0,r:0};s.push({w:l.w,r:l.r,rpe:'',rir:'',warm:false,note:''});save();go()},rmSet(i,j){S.draft.en[i].sets.splice(j,1);save();go()},
 finish(){const d=S.draft;d.en=d.en.map(e=>({...e,sets:e.sets.filter(s=>s.r>0||s.w>0)})).filter(e=>e.sets.length);if(!d.en.length){alert('Log at least one set.');return}
  const before=allPR(),w={id:d.editId||uid(),name:d.name,date:d.date,en:d.en};S.wk=S.wk.filter(x=>x.id!=w.id);S.wk.push(w);const after=allPR();
  S.recapPR=after.filter(a=>a.k!='vol'&&d.en.some(e=>ex(e.ex).name==a.n)&&a.date==d.date&&a.v>(before.find(b=>b.n==a.n&&b.k==a.k)?.v||0)&&before.some(b=>b.n==a.n)).map(a=>a.n+' '+(a.k=='heavy'?'heaviest':'e1RM'));S.recap=w.id;S.draft=null;save();go()},
 edit(id){const w=S.wk.find(x=>x.id==id);S.draft=JSON.parse(JSON.stringify({...w,editId:w.id}));save();scrollTo(0,0);go()},del(id){if(confirm('Delete this workout? Stats will recalculate.')){S.wk=S.wk.filter(w=>w.id!=id);save();go()}},
 saveEx(id){const n=$('#en').value.trim();if(!n)return;const o={id:id||uid(),name:n,p:$('#ep').value,s:[...document.querySelectorAll('.sm2:checked')].map(x=>x.value).filter(x=>x!=$('#ep').value),cat:$('#ec').value,eq:$('#eq').value,pat:$('#pt').value,uni:$('#eu').value=='unilateral',notes:$('#enn').value,inc:+$('#ei').value||0};if(id)S.ex[S.ex.findIndex(e=>e.id==id)]=o;else S.ex.push(o);UI.edit=null;save();go()},
 delEx(id){if(confirm('Delete this exercise? Logged sets using it stay in history but lose muscle mapping.')){S.ex=S.ex.filter(e=>e.id!=id);save();go()}},
 acc(id,w,r,s,d){S.targets[id]={w,text:`${w} kg × ${r}, ${s} sets`,date:d,state:'accepted'};save();go()},dis(id,d){S.targets[id]={date:d,state:'dismissed'};save();go()},
 edt(id,w,r,s,d){const v=prompt('Target weight (kg):',w);if(v===null||isNaN(+v))return;S.targets[id]={w:+v,text:`${+v} kg × ${r}, ${s} sets`,date:d,state:'accepted (edited)'};S.targets[id].state='accepted';save();go()},
 goal(){const t=+$('#gt').value;if(t>0){S.goals.push({ex:$('#ge').value,t});save();go()}},bw(){const v=+$('#bw').value;if(v>0){S.bw.push({d:today(),kg:v});save();go()}},note(){const t=$('#nt').value.trim();if(t){S.notes.push({d:today(),t});save();go()}},
 async dl(name,data,type){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}catch(e){alert('Download unavailable here.')}},
 csv(){const r=[['date','workout','exercise','set','kg','reps','rpe','rir','warmup','note']];S.wk.forEach(w=>w.en.forEach(e=>e.sets.forEach((s,i)=>r.push([w.date,w.name,ex(e.ex)?.name,i+1,s.w,s.r,s.rpe,s.rir,s.warm,s.note]))));this.dl('workouts.csv',r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')},json(){this.dl('fairway-backup.json',JSON.stringify(S),'application/json')}};
